<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="70%" stop-color="#0a0d14"/>
      <stop offset="100%" stop-color="#030712"/>
    </radialGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="url(#glowGrad)" stroke-width="4" stroke-opacity="0.4"/>

  <!-- Radar Tactical Rings -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#06b6d4" stroke-width="2" stroke-opacity="0.2" stroke-dasharray="8 8"/>
  <circle cx="256" cy="256" r="120" fill="none" stroke="#10b981" stroke-width="2" stroke-opacity="0.25"/>
  <circle cx="256" cy="256" r="60" fill="none" stroke="#10b981" stroke-width="1.5" stroke-opacity="0.3"/>

  <!-- Crosshairs -->
  <line x1="256" y1="56" x2="256" y2="456" stroke="#06b6d4" stroke-width="1.5" stroke-opacity="0.15"/>
  <line x1="56" y1="256" x2="456" y2="256" stroke="#06b6d4" stroke-width="1.5" stroke-opacity="0.15"/>

  <!-- Tactical Hexagon Shield -->
  <polygon points="256,110 376,180 376,332 256,402 136,332 136,180" 
           fill="rgba(15, 23, 42, 0.75)" 
           stroke="url(#glowGrad)" 
           stroke-width="5" 
           filter="url(#neonGlow)"/>

  <!-- Central Rescue Lightning Bolt -->
  <path d="M272 152 L176 272 L248 272 L232 368 L336 244 L264 244 Z" 
        fill="url(#glowGrad)" 
        filter="url(#neonGlow)"/>

  <!-- Tactical Corner Accents -->
  <path d="M72 120 L72 72 L120 72" fill="none" stroke="#10b981" stroke-width="4" stroke-linecap="round"/>
  <path d="M440 120 L440 72 L392 72" fill="none" stroke="#10b981" stroke-width="4" stroke-linecap="round"/>
  <path d="M72 392 L72 440 L120 440" fill="none" stroke="#06b6d4" stroke-width="4" stroke-linecap="round"/>
  <path d="M440 392 L440 440 L392 440" fill="none" stroke="#06b6d4" stroke-width="4" stroke-linecap="round"/>
</svg>
